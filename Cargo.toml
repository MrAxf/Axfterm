# Axfterm — workspace.
#
# Grafo de dependencias permitido (ver AGENTS.md):
#   app       -> {ui, terminal, workspace, agents, config}
#   workspace -> {terminal, agents, config, ui}
#   ui        no conoce terminal ni agents
#   agents    no conoce GPUI
#   config    no conoce terminal
#
# Las dependencias se declaran por crate a medida que se implementan, con
# justificación de peso/licencia/mantenimiento.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Juan Andrés"]
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
unwrap_used = "warn"
