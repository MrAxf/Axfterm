selection = "#8a5e0040"
dim_foreground = "#7d92a5"
ansi = [
  "#193549", "#b01545", "#2a7a00", "#8a5e00",
  "#0068b3", "#8a3ab9", "#006c8f", "#cbd8e4",
  "#566d80", "#b01545", "#2a7a00", "#8a5e00",
  "#0068b3", "#8a3ab9", "#006c8f", "#193549",
]
