[package]
name = "axfterm"
description = "Terminal workspace nativo y keyboard-first para Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# Axfterm Studio: control y capturas solo para desarrollo (ver docs/studio.md).
studio = [
    "axf_ui/studio",
    "dep:png",
    "dep:serde",
    "dep:serde_json",
]

[dependencies]
anyhow.workspace = true
axf_agents.workspace = true
axf_config.workspace = true
axf_terminal.workspace = true
# GPUI se consume siempre a través de `axf_ui` (ver ADR 0002).
axf_ui.workspace = true
axf_workspace.workspace = true
# Canal de la instancia única y tareas de UI (M9).
async-channel.workspace = true
png = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[build-dependencies]
winresource.workspace = true

[lints]
workspace = true
