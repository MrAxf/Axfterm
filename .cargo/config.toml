# Configuración de Cargo del workspace.
#
# Limitar compilaciones y tests para reducir la presión sobre el escritorio.
# Los jobs de Cargo no limitan los hilos internos del linker ni la memoria.
#
# Para subir el límite sin editar este archivo:
#   $env:CARGO_BUILD_JOBS = 2
# o ejecutar a través del wrapper (prioridad BelowNormal y serialización):
#   pwsh -File scripts/cargo-low.ps1 <subcomando> ...

[build]
jobs = 1

[env]
RUST_TEST_THREADS = { value = "1", force = false }
